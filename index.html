<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6efe5"><title>角色藏馆 · 可莉与魈</title><link rel="stylesheet" href="./web/style.css?v=20261014-gallery"></head>
<body><main><header><a class="brand" href="#">✦ <span>角色藏馆</span></a><nav class="character-tabs" aria-label="选择角色"><button data-character="klee" aria-pressed="true">可莉 <small>KLEE</small></button><button data-character="xiao" aria-pressed="false">魈 <small>XIAO</small></button></nav><button id="fullscreen" class="quiet">全屏观赏 ↗</button></header><section class="exhibit"><div class="intro"><p class="eyebrow">CHARACTER ARCHIVE / 06</p><p class="subtitle" id="subtitle">小小冒险家</p><h1><b id="character-name">可莉</b><span id="character-en">KLEE</span></h1><p class="description" id="description">转动视角，<br>看见帽檐、背包与衣纹的细节。</p><div class="intro-foot"><span class="spark">✧</span><p>红色的帽子，<br>装着小小的好奇心。</p></div></div><div class="stage" id="stage"><div class="halo"></div><span id="watermark" class="watermark" aria-hidden="true">KLEE</span><canvas id="canvas" aria-label="可旋转和缩放的角色三维模型"></canvas><div id="loading" role="status"><b>正在打开藏馆</b><span>载入角色与贴图…</span></div><div class="stage-top"><span id="view-label">全身展示</span><span class="live"><i></i> 实时三维</span></div><div class="stage-bottom"><span class="hint">拖动旋转 · 滚轮缩放</span><button id="reset" class="quiet">↺ 重置视角</button></div></div><aside><div class="panel-title">发现细节 <small>EXPLORE</small></div><div class="views"><button data-view="full" class="selected" aria-pressed="true">01 <span>全身展示</span> ↗</button><button data-view="portrait" aria-pressed="false">02 <span>帽子与表情</span> ↗</button><button data-view="back" aria-pressed="false">03 <span>背包与衣饰</span> ↗</button></div><section class="animation" aria-label="跑步动画"><div class="motion-buttons"><button id="play" disabled>▶ 跑步</button><button id="static" aria-pressed="true">静态展示</button><button id="mask" hidden aria-pressed="false">面具特写</button></div><div id="timeline" hidden><div class="time-row"><span id="time">0.0 s</span><select id="speed" aria-label="动画速度"><option value="0.5">0.5 倍速</option><option value="1" selected>1 倍速</option><option value="1.5">1.5 倍速</option><option value="2">2 倍速</option></select><span id="duration">6.0 s</span><button id="music-toggle" hidden aria-pressed="true" aria-label="关闭舞蹈音乐">♪</button></div><input id="seek" aria-label="跑步动画进度" type="range" min="0" max="6" value="0" step="0.01"></div></section><details class="display-settings"><summary>展示设置 <span>环绕 · 背景 · 保存</span></summary><div class="settings"><label>自动环绕<button id="rotate" class="toggle" aria-label="自动环绕" aria-pressed="false"></button></label><label>网格线框<button id="wire" class="toggle" aria-label="网格线框" aria-pressed="false"></button></label><div class="setting">背景氛围<div class="swatches"><button data-bg="cream" class="cream selected" aria-label="奶油背景" aria-pressed="true"></button><button data-bg="rose" class="rose" aria-label="暖红背景" aria-pressed="false"></button><button data-bg="night" class="night" aria-label="深夜背景" aria-pressed="false"></button></div></div><button id="capture" class="capture">保存当前画面 ↓</button></div></details><p class="note" id="character-note">原始跑步动作 · 约 6 秒<br>可暂停、拖动进度与变速。<br>保留原始跑步动作与表情。</p></aside></section><footer><p id="credit">可莉 · 原始跑步动作</p><p>角色来自《原神》 / © HoYoverse <span>·</span> 非官方展示</p></footer></main><div id="toast" role="status"></div><audio id="dance-music" src="./web/assets/风影舞曲.wav" preload="none" loop></audio><script type="module" src="./web/app.js?v=20261014-gallery"></script></body></html>
